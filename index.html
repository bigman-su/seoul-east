<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>제43회기 서울동지방회 9월 월례회의 건</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #eeeeee;
      font-family: "Noto Sans KR", "Malgun Gothic", sans-serif;
      color: #222;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255,255,255,.96);
      border-bottom: 1px solid #ddd;
      padding: 12px 16px;
      text-align: center;
      box-shadow: 0 1px 5px rgba(0,0,0,.08);
    }
    .topbar h1 {
      margin: 0 0 8px;
      font-size: 16px;
      font-weight: 700;
    }
    .actions {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }
    button, .download {
      border: 0;
      border-radius: 7px;
      padding: 9px 14px;
      background: #174a88;
      color: white;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
    }
    .page {
      width: min(960px, calc(100% - 24px));
      margin: 24px auto 40px;
      background: white;
      padding: 18px;
      box-shadow: 0 2px 14px rgba(0,0,0,.12);
    }
    .page img {
      display: block;
      width: 100%;
      height: auto;
    }
    .notice {
      max-width: 960px;
      margin: 0 auto 28px;
      padding: 0 12px;
      color: #666;
      text-align: center;
      font-size: 13px;
    }
    .documents {
      max-width: 960px;
      margin: 0 auto 40px;
      padding: 24px;
      background: white;
      box-shadow: 0 2px 14px rgba(0,0,0,.10);
    }

    .documents h2 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 20px;
      color: #174a88;
    }

    .documents p {
      margin: 0 0 20px;
      text-align: center;
      color: #666;
      font-size: 14px;
    }

    .document-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .document-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fafafa;
    }

    .document-title {
      font-size: 15px;
      font-weight: 600;
    }

    .document-download {
      flex-shrink: 0;
      padding: 9px 14px;
      border-radius: 7px;
      background: #174a88;
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .document-item {
        flex-direction: column;
        align-items: stretch;
      }

      .document-download {
        text-align: center;
      }
    }

    @media print {
    @media print {
      .topbar, .notice { display: none; }
      body { background: white; }
      .page {
        width: 100%;
        margin: 0;
        padding: 0;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>제43회기 서울동지방회 9월 월례회의 건</h1>
    <div class="actions">
      <button onclick="window.print()">인쇄 / PDF 저장</button>
      <a class="download" href="seoul-east-area-notice.jpg" download>공문 이미지 저장</a>
    </div>
  </div>

  <main class="page">
    <img src="seoul-east-area-notice.jpg"
         alt="예수교대한성결교회 서울동지방회 제43회기 9월 월례회 공문">
  </main>

  <p class="notice">
    예수교대한성결교회 서울동지방회 행정문서 및 공문을 웹에서 보기 위한 페이지입니다.
  </p>
    <section class="documents">
    <h2>📂 서울동지방회 행정자료실</h2>
    <p>교단 행정업무에 필요한 서식을 다운로드할 수 있습니다.</p>

    <div class="document-list">

      <div class="document-item">
        <div class="document-title">
          📝 교직자 인사기록표
        </div>
        <a class="document-download"
           href="documents/교직자인사기록표.hwp"
           download>
          한글파일 다운로드
        </a>
      </div>

      <div class="document-item">
        <div class="document-title">
          📊 교세통계자료 보고서
        </div>
        <a class="document-download"
           href="documents/교세통계자료보고서.hwp"
           download>
          한글파일 다운로드
        </a>
      </div>

    </div>
  </section>
</body>
</html>
